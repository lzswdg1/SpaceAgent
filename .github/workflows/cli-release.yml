name: CLI Release

on:
  push:
    tags:
      - 'cli-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require final public repository identity
        run: scripts/check-release-repository-identity.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go.sum

      - name: Scan release commit and current tree for secrets
        env:
          GITLEAKS_VERSION: v8.28.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          "$RUNNER_TEMP/bin/gitleaks" git --redact=100 --exit-code 1 --log-opts="-1 $GITHUB_SHA" .
          "$RUNNER_TEMP/bin/gitleaks" dir --redact=100 --exit-code 1 .

      - name: Test CLI
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          args: check
          workdir: cli

      - name: Generate CLI dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: cli
          format: spdx-json
          syft-version: v1.40.0
          artifact-name: spaceagent-cli-source-dependencies.spdx.json
          output-file: ${{ runner.temp }}/spaceagent-cli-source-dependencies.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
