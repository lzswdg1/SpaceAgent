global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'platform-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['platform-server:9000']
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: 'knowledge-worker'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['knowledge-worker']
        type: A
        port: 9000
