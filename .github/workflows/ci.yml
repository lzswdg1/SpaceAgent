name: CI

on:
  push:
    branches:
      - main
      - demo
      - 'feature-*'
      - 'feature/**'
      - 'codex/**'
  pull_request:
    branches: [main, demo]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go.sum

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/multi-agent-orchestrator/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: workers/sandbox-worker/pyproject.toml

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'shared/**/pom.xml', 'apps/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Scan introduced commits and current tree for secrets
        env:
          GITLEAKS_VERSION: v8.28.0
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            LOG_OPTS="--all"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            LOG_OPTS="$BEFORE_SHA..$HEAD_SHA"
          else
            LOG_OPTS="--all"
          fi
          "$RUNNER_TEMP/bin/gitleaks" git --redact=100 --exit-code 1 --log-opts="$LOG_OPTS" .
          "$RUNNER_TEMP/bin/gitleaks" dir --redact=100 --exit-code 1 .

      - name: Check public-source boundaries
        run: |
          python scripts/check-public-source-boundaries.py
          python scripts/check-ci-release-boundaries.py

      - name: Install Web dependencies
        run: npm ci

      - name: Install Multi-Agent dependencies
        working-directory: services/multi-agent-orchestrator
        run: npm ci

      - name: Install Sandbox Worker dependencies
        run: |
          python -m venv "$RUNNER_TEMP/sandbox-worker-venv"
          "$RUNNER_TEMP/sandbox-worker-venv/bin/pip" install ./workers/sandbox-worker

      - name: Verify Java platform and package
        run: ./mvnw -B verify

      - name: Validate architecture
        run: scripts/check-architecture.sh

      - name: Test and build Tenant Web
        run: |
          npm test
          npm run build

      - name: Test and build Admin Web
        run: |
          npm run test:admin
          npm run build:admin

      - name: Test and vet CLI
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...

      - name: Test and build Multi-Agent Orchestrator
        working-directory: services/multi-agent-orchestrator
        run: |
          npm test
          npm run build

      - name: Test Sandbox Worker
        run: |
          "$RUNNER_TEMP/sandbox-worker-venv/bin/python" -m unittest discover \
            -s workers/sandbox-worker/tests -t workers/sandbox-worker -v

      - name: Test release security configuration
        run: |
          python -m unittest scripts/test_release_environment.py -v
          python -m unittest scripts/test_low_resource_plan.py -v

      - name: Test public-source exporter
        run: scripts/test-export-public-source.sh

      - name: Validate shell scripts
        run: |
          bash -n scripts/release-preflight.sh
          bash -n scripts/smoke-platform-live.sh
          bash -n scripts/regression-platform-api.sh
          bash -n scripts/regression-tracing-local.sh
          bash -n scripts/jvm-load-baseline.sh
          bash -n scripts/jvm-jfr-profile.sh
          bash -n scripts/collect-jvm-diagnostics.sh
          bash -n scripts/migrate-m8-data-cutover.sh
          bash -n scripts/verify-m8-data-cutover.sh
          bash -n scripts/backup-platform.sh
          bash -n scripts/restore-platform.sh
          bash -n scripts/verify-platform-backup.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Compose configurations
        run: scripts/check-compose-configs.sh

      - name: Check five Dockerfiles
        run: scripts/check-dockerfiles.sh

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          args: check
          workdir: cli

      - name: Audit production npm dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix services/multi-agent-orchestrator audit --omit=dev --audit-level=high

      - name: Generate source and dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          syft-version: v1.40.0
          artifact-name: spaceagent-source-dependencies-${{ github.sha }}.spdx.json
          output-file: ${{ runner.temp }}/spaceagent-source-dependencies.spdx.json
          upload-artifact: true
          upload-release-assets: false

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high

  build-images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: platform-server
            dockerfile: apps/platform-server/Dockerfile
          - service: platform-admin-server
            dockerfile: apps/platform-admin-server/Dockerfile
          - service: sandbox-worker
            dockerfile: workers/sandbox-worker/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: admin-web
            dockerfile: apps/admin-web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
