worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    client_max_body_size 8m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    location = /version {
      if ($request_method != GET) { return 405; }
      if ($args != '') { return 400; }
      proxy_pass_request_headers off;
      proxy_pass http://rag-parser:9998/version;
    }
    location = /rmeta {
      if ($request_method != PUT) { return 405; }
      if ($args != '') { return 400; }
      proxy_pass_request_headers off;
      proxy_set_header Content-Type $content_type;
      proxy_set_header Accept application/json;
      proxy_set_header writeLimit 1000000;
      proxy_set_header maxEmbeddedResources 0;
      proxy_set_header X-Tika-Skip-Embedded true;
      proxy_set_header X-Tika-PDFOcrStrategy no_ocr;
      proxy_pass http://rag-parser:9998/rmeta;
    }
    location / { return 404; }
  }
}
